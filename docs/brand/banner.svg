<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420">
  <defs>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="70"/></filter>
    <radialGradient id="dot" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="0.4" stop-color="#ffd6ec" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ffd6ec" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b0a0f" stop-opacity="0"/>
      <stop offset="1" stop-color="#0b0a0f" stop-opacity="0.55"/>
    </linearGradient>
    <clipPath id="card"><rect width="1280" height="420" rx="28"/></clipPath>
  </defs>
  <g clip-path="url(#card)">
    <rect width="1280" height="420" fill="#0b0a0f"/>
    <!-- aura: the same cover-tinted field the app lives on -->
    <g filter="url(#blur)" opacity="0.9">
      <circle cx="250" cy="90" r="190" fill="#ff5fa8"/>
      <circle cx="620" cy="360" r="210" fill="#7a5cff"/>
      <circle cx="1060" cy="120" r="200" fill="#3f86ff"/>
      <circle cx="900" cy="420" r="160" fill="#ff9a6b" opacity="0.6"/>
    </g>
    <rect width="1280" height="420" fill="url(#fade)"/>
    <!-- grain-free stars -->
    <g fill="#fff" opacity="0.55">
      <circle cx="120" cy="320" r="1.6"/><circle cx="1180" cy="300" r="1.4"/><circle cx="980" cy="60" r="1.2"/>
      <circle cx="420" cy="50" r="1.3"/><circle cx="760" cy="40" r="1.1"/><circle cx="1220" cy="190" r="1.5"/>
      <circle cx="60" cy="120" r="1.2"/><circle cx="520" cy="390" r="1.2"/>
    </g>
    <!-- wordmark "oto", drawn from strokes -->
    <g fill="none" stroke="#fff" stroke-width="30" stroke-linecap="round" transform="translate(452 110)">
      <circle cx="62" cy="96" r="58"/>
      <path d="M188 22 V146 Q188 158 200 158 H214"/>
      <path d="M158 62 H222"/>
      <circle cx="314" cy="96" r="58"/>
    </g>
    <circle cx="808" cy="160" r="40" fill="url(#dot)"/>
    <circle cx="808" cy="160" r="12" fill="#fff"/>
    <text x="640" y="330" text-anchor="middle" fill="#ffffff" fill-opacity="0.92" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="26" font-weight="600">Музыкальный плеер, который подстраивается под песню</text>
    <text x="640" y="368" text-anchor="middle" fill="#ffffff" fill-opacity="0.55" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="18">локальные файлы · Яндекс Музыка · SoundCloud · Spotify — в одной библиотеке</text>
  </g>
</svg>
