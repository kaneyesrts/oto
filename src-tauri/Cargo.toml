[package]
name = "oto"
version = "0.1.0"
description = "oto — music player"
authors = ["oto"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "oto_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["image-png", "protocol-asset", "tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rodio = { version = "0.23.0", default-features = false, features = ["playback", "symphonia-all"] }
lofty = "0.25.5"
realfft = "3.5.1"
walkdir = "2.5.0"
parking_lot = "0.13.0"
anyhow = "1.0.104"
thiserror = "2.0.21"
crossbeam-channel = "0.5.17"
base64 = "0.23.1"
sha1_smol = "1.0.1"
dirs = "7.0.0"
once_cell = "1.21.4"
regex = "1.13.2"
rusqlite = { version = "0.43.0", features = ["bundled"] }
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros"] }
souvlaki = "0.9.3"
tauri-plugin-dialog = "2.8.4"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls", "blocking", "query"] }
tauri-plugin-global-shortcut = "2.4.1"
tauri-plugin-single-instance = "2.5.5"
sha2 = "0.11"
hmac = "0.13.0"
md-5 = "0.11.0"
librespot-core = { version = "0.8", default-features = false, features = ["rustls-tls-webpki-roots"] }
librespot-playback = { version = "0.8", default-features = false, features = ["rustls-tls-webpki-roots"] }
librespot-oauth = { version = "0.8", default-features = false, features = ["rustls-tls-webpki-roots"] }
aes = "0.8"
ctr = "0.9"
hex = "0.4"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

# Optimise dependencies in dev builds: decoding, FFT and image work are unusably slow at opt-level 0.
[profile.dev.package."*"]
opt-level = 2
